[project]
name = "ojp"
version = "0.1.0"
description = "Open Job Protocol PoC"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.1.1,<3",
    "pydantic>=2.5,<3",
]

[project.scripts]
ojp = "ojp.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "anyio>=4.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ojp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
